services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scope-local}
      POSTGRES_DB: ${POSTGRES_DB:-scope}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: [uvicorn, "scope_api.main:app", --host, "0.0.0.0"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: [celery, -A, "scope_worker.main:app", worker, --loglevel=INFO]
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      redis: { condition: service_healthy }
volumes:
  database:
